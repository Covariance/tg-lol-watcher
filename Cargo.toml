[package]
name = "lolwatch"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Watches League of Legends players and posts session and weekly summaries to Telegram"
publish = false

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
log = { version = "0.4", features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
