[riot]
default_platform = "euw1"
poll_interval_seconds = 120

[notifications]
mode = "session"              # session | per_game | off
session_gap_minutes = 15
flush_recheck_minutes = 5
max_postpones = 18

[weekly]
enabled = true
day = "sunday"
time = "20:00"
timezone = "Europe/London"

[telegram]
admin_user_ids = [123456789]

[logging]
level = "INFO"
